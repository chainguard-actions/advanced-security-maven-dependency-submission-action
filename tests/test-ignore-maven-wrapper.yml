name: Test ignore-maven-wrapper uses mvn from PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up maven project with both mvnw and a fake mvn on PATH
        run: |
          set -e
          rm -rf /tmp/mvn-project /tmp/mvn-invocation /tmp/fake-mvn-bin
          mkdir -p /tmp/mvn-project /tmp/mvn-invocation /tmp/fake-mvn-bin
          cat > /tmp/mvn-project/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>demo</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
          cat > /tmp/depgraph.json <<'EOF'
          {
            "graphName" : "demo",
            "artifacts" : [ {
              "id" : "com.example:demo:jar:compile",
              "numericId" : 1,
              "groupId" : "com.example",
              "artifactId" : "demo",
              "version" : "1.0.0",
              "optional" : false,
              "scopes" : [ "compile" ],
              "types" : [ "jar" ]
            }, {
              "id" : "org.slf4j:slf4j-api:jar:compile",
              "numericId" : 2,
              "groupId" : "org.slf4j",
              "artifactId" : "slf4j-api",
              "version" : "2.0.9",
              "optional" : false,
              "scopes" : [ "compile" ],
              "types" : [ "jar" ]
            } ],
            "dependencies" : [ {
              "from" : "com.example:demo:jar:compile",
              "to" : "org.slf4j:slf4j-api:jar:compile",
              "numericFrom" : 1,
              "numericTo" : 2,
              "resolution" : "INCLUDED"
            } ]
          }
          EOF
          cat > /tmp/mvn-project/mvnw <<'EOF'
          #!/bin/sh
          echo "wrapper" > /tmp/mvn-invocation/which.txt
          echo "$@" > /tmp/mvn-invocation/args.txt
          exit 1
          EOF
          chmod +x /tmp/mvn-project/mvnw
          cat > /tmp/fake-mvn-bin/mvn <<'EOF'
          #!/bin/sh
          echo "path-mvn" > /tmp/mvn-invocation/which.txt
          echo "$@" > /tmp/mvn-invocation/args.txt
          cp /tmp/depgraph.json "$(pwd)/maven-dependency-submission-action-depgraph.json"
          exit 0
          EOF
          chmod +x /tmp/fake-mvn-bin/mvn
          echo "/tmp/fake-mvn-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/mvn-project
          ignore-maven-wrapper: 'true'
      - name: Assert mvn from PATH was used instead of the wrapper
        run: |
          if [ ! -f /tmp/mvn-invocation/which.txt ]; then
            echo "FAIL: no maven executable was invoked"
            exit 1
          fi
          WHICH="$(cat /tmp/mvn-invocation/which.txt)"
          echo "which: $WHICH"
          echo "args: $(cat /tmp/mvn-invocation/args.txt)"
          if [ "$WHICH" != "path-mvn" ]; then
            echo "FAIL: expected mvn from PATH, got '$WHICH'"
            exit 1
          fi
          if ! grep -qF "com.github.ferstl:depgraph-maven-plugin:4.0.3:graph" /tmp/mvn-invocation/args.txt; then
            echo "FAIL: depgraph plugin goal missing"
            exit 1
          fi
          echo "PASS"
      - name: Assert outcome (submission may fail on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot generated and submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snapshot generated; submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
