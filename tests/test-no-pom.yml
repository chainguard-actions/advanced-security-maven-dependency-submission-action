name: Test directory without a pom fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure maven is available
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq maven
          fi
          mvn -v
      - name: Prepare empty directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/work-no-pom"
          mkdir -p "$GITHUB_WORKSPACE/work-no-pom"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/work-no-pom
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no pom.xml is present"
            exit 1
          fi
          echo "PASS"
