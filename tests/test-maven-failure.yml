name: Test maven failure causes action failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up maven project with a failing mvnw
        run: |
          set -e
          rm -rf /tmp/mvn-project /tmp/mvn-invocation
          mkdir -p /tmp/mvn-project /tmp/mvn-invocation
          echo '<project/>' > /tmp/mvn-project/pom.xml
          cat > /tmp/mvn-project/mvnw <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/mvn-invocation/args.txt
          echo "[ERROR] simulated build failure" >&2
          exit 1
          EOF
          chmod +x /tmp/mvn-project/mvnw
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/mvn-project
      - name: Assert maven ran and action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f /tmp/mvn-invocation/args.txt ]; then
            echo "FAIL: maven wrapper was never invoked"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when maven exits non-zero"
            exit 1
          fi
          echo "PASS"
