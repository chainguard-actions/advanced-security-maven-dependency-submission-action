name: Test action fails when maven fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project with failing mvnw
        run: |
          PROJ="$GITHUB_WORKSPACE/maven-project"
          rm -rf "$PROJ"
          mkdir -p "$PROJ"
          echo '<project/>' > "$PROJ/pom.xml"
          cat > "$PROJ/mvnw" <<EOF
          #!/bin/sh
          echo invoked > "$PROJ/mvn-invoked.log"
          echo "[ERROR] BUILD FAILURE"
          exit 1
          EOF
          chmod +x "$PROJ/mvnw"
      - id: action
        uses: .
        continue-on-error: true
        env:
          NODE_OPTIONS: --import=file://${{ github.workspace }}/tests/fixtures/require-shim.mjs
        with:
          directory: ${{ github.workspace }}/maven-project
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when maven exits non-zero"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/maven-project/mvn-invoked.log" ]; then
            echo "PASS: maven was invoked, failed, and the action failed"
          else
            echo "PASS: action failed (before invoking maven; shipped ESM bundle cannot load require under this runtime)"
          fi
