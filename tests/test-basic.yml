name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure maven is available
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq maven
          fi
          mvn -v
      - name: Prepare fresh project directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/work-basic"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple" "$GITHUB_WORKSPACE/work-basic"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/work-basic
      - name: Assert dependency graph generated (submission may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          FILES="$(find "$GITHUB_WORKSPACE/work-basic" -name maven-dependency-submission-action-depgraph.json)"
          echo "depgraph files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: depgraph json was not generated by maven"
            exit 1
          fi
          if ! grep -q 'junit' $FILES; then
            echo "FAIL: depgraph does not contain junit dependency"
            cat $FILES
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot generated and submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snapshot generated; submission failed gracefully (sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
