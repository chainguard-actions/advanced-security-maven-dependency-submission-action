name: Test maven wrapper is used when present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare project with a fake mvnw
        run: |
          D="$GITHUB_WORKSPACE/work-wrapper"
          rm -rf "$D"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple" "$D"
          cat > "$D/mvnw" <<'EOF'
          #!/bin/sh
          echo "fake mvnw invoked with: $*"
          echo "$*" > "$(dirname "$0")/mvnw-invoked.txt"
          exit 0
          EOF
          chmod +x "$D/mvnw"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/work-wrapper
          maven-args: -Dfoo=bar
      - name: Assert wrapper was invoked with depgraph goal
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          M="$GITHUB_WORKSPACE/work-wrapper/mvnw-invoked.txt"
          if [ ! -f "$M" ]; then
            echo "FAIL: mvnw wrapper was not invoked"
            exit 1
          fi
          ARGS="$(cat "$M")"
          echo "wrapper args: $ARGS"
          for want in "-B" "-Dfoo=bar" "com.github.ferstl:depgraph-maven-plugin" "-DgraphFormat=json" "-DoutputFileName=maven-dependency-submission-action-depgraph.json"; do
            case "$ARGS" in
              *"$want"*) ;;
              *) echo "FAIL: expected '$want' in wrapper args"; exit 1 ;;
            esac
          done
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
