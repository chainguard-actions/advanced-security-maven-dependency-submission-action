name: Test maven wrapper is used to generate dependency graph
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up maven project with a fake mvnw wrapper
        run: |
          set -e
          rm -rf /tmp/mvn-project /tmp/mvn-invocation
          mkdir -p /tmp/mvn-project /tmp/mvn-invocation
          cat > /tmp/mvn-project/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>demo</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
          cat > /tmp/depgraph.json <<'EOF'
          {
            "graphName" : "demo",
            "artifacts" : [ {
              "id" : "com.example:demo:jar:compile",
              "numericId" : 1,
              "groupId" : "com.example",
              "artifactId" : "demo",
              "version" : "1.0.0",
              "optional" : false,
              "scopes" : [ "compile" ],
              "types" : [ "jar" ]
            }, {
              "id" : "junit:junit:jar:test",
              "numericId" : 2,
              "groupId" : "junit",
              "artifactId" : "junit",
              "version" : "4.13.2",
              "optional" : false,
              "scopes" : [ "test" ],
              "types" : [ "jar" ]
            } ],
            "dependencies" : [ {
              "from" : "com.example:demo:jar:compile",
              "to" : "junit:junit:jar:test",
              "numericFrom" : 1,
              "numericTo" : 2,
              "resolution" : "INCLUDED"
            } ]
          }
          EOF
          cat > /tmp/mvn-project/mvnw <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/mvn-invocation/args.txt
          pwd > /tmp/mvn-invocation/cwd.txt
          echo "wrapper" > /tmp/mvn-invocation/which.txt
          cp /tmp/depgraph.json "$(pwd)/maven-dependency-submission-action-depgraph.json"
          exit 0
          EOF
          chmod +x /tmp/mvn-project/mvnw
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/mvn-project
      - name: Assert wrapper was invoked with depgraph plugin arguments
        run: |
          if [ ! -f /tmp/mvn-invocation/args.txt ]; then
            echo "FAIL: mvnw wrapper was never invoked"
            exit 1
          fi
          ARGS="$(cat /tmp/mvn-invocation/args.txt)"
          echo "args: $ARGS"
          echo "which: $(cat /tmp/mvn-invocation/which.txt)"
          echo "cwd: $(cat /tmp/mvn-invocation/cwd.txt)"
          [ "$(cat /tmp/mvn-invocation/which.txt)" = "wrapper" ] || { echo "FAIL: wrapper not used"; exit 1; }
          [ "$(cat /tmp/mvn-invocation/cwd.txt)" = "/tmp/mvn-project" ] || { echo "FAIL: wrong cwd"; exit 1; }
          for expected in "-B" "com.github.ferstl:depgraph-maven-plugin:4.0.3:graph" "-DgraphFormat=json" "-DoutputFileName=maven-dependency-submission-action-depgraph.json"; do
            if ! echo " $ARGS " | grep -qF -- " $expected "; then
              echo "FAIL: missing argument '$expected'"
              exit 1
            fi
          done
          if echo "$ARGS" | grep -qF -- "--settings"; then
            echo "FAIL: --settings should not be passed when settings-file is unset"
            exit 1
          fi
          echo "PASS"
      - name: Assert outcome (submission may fail on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot generated and submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snapshot generated; submission failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
