name: Test settings file, maven args and custom detector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure maven is available
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq maven
          fi
          mvn -v
      - name: Prepare fresh project directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/work-settings"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple" "$GITHUB_WORKSPACE/work-settings"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/work-settings
          settings-file: ${{ github.workspace }}/tests/fixtures/settings.xml
          maven-args: -Dmaven.test.skip=true -Dstyle.color=never
          ignore-maven-wrapper: 'true'
          detector-name: custom-detector
          detector-version: 9.9.9
          detector-url: https://example.com/detector
          correlator: act-test-correlator
          snapshot-sha: ${{ github.sha }}
          snapshot-ref: refs/heads/act-harness
      - name: Assert dependency graph generated (submission may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          FILES="$(find "$GITHUB_WORKSPACE/work-settings" -name maven-dependency-submission-action-depgraph.json)"
          echo "depgraph files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: depgraph json was not generated (settings file / maven args not accepted?)"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snapshot generated and submitted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snapshot generated; submission failed gracefully (sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
