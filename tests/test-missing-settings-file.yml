name: Test action fails when settings-file does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project with fake mvnw
        run: |
          PROJ="$GITHUB_WORKSPACE/maven-project"
          rm -rf "$PROJ"
          mkdir -p "$PROJ"
          echo '<project/>' > "$PROJ/pom.xml"
          cat > "$PROJ/mvnw" <<EOF
          #!/bin/sh
          echo invoked > "$PROJ/mvn-invoked.log"
          mkdir -p target
          cp "$GITHUB_WORKSPACE/tests/fixtures/depgraph.json" target/maven-dependency-submission-action-depgraph.json
          EOF
          chmod +x "$PROJ/mvnw"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/maven-project
          settings-file: ${{ github.workspace }}/does-not-exist/settings.xml
      - name: Assert action failed before running maven
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing settings file"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/maven-project/mvn-invoked.log" ]; then
            echo "FAIL: maven should not have been invoked"
            exit 1
          fi
          echo "PASS"
