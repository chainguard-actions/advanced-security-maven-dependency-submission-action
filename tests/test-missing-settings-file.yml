name: Test missing settings-file fails before running maven
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up maven project with fake mvnw
        run: |
          set -e
          rm -rf /tmp/mvn-project /tmp/mvn-invocation
          mkdir -p /tmp/mvn-project /tmp/mvn-invocation
          echo '<project/>' > /tmp/mvn-project/pom.xml
          cat > /tmp/mvn-project/mvnw <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/mvn-invocation/args.txt
          exit 0
          EOF
          chmod +x /tmp/mvn-project/mvnw
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/mvn-project
          settings-file: /tmp/does-not-exist/settings.xml
      - name: Assert action failed and maven was not invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing settings file"
            exit 1
          fi
          if [ -f /tmp/mvn-invocation/args.txt ]; then
            echo "FAIL: maven should not have been invoked"
            exit 1
          fi
          echo "PASS"
