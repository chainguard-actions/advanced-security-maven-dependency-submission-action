name: Test missing settings file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fresh project directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/work-missing-settings"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple" "$GITHUB_WORKSPACE/work-missing-settings"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ github.workspace }}/work-missing-settings
          settings-file: ${{ github.workspace }}/tests/fixtures/does-not-exist-settings.xml
      - name: Assert action failed and no graph produced
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a non-existent settings file"
            exit 1
          fi
          FILES="$(find "$GITHUB_WORKSPACE/work-missing-settings" -name maven-dependency-submission-action-depgraph.json)"
          if [ -n "$FILES" ]; then
            echo "FAIL: maven should not have run, but found: $FILES"
            exit 1
          fi
          echo "PASS"
